name: W33 Pass 11190 ame10 sign structure

on:
  push:
    paths:
      - "analysis/w33_pass11190_*.py"
      - "analysis/PASS11190_AME10_SIGN_STRUCTURE.md"
      - "data/w33_pass11190_*.json"
      - "tests/test_w33_pass11190_ame10_sign_structure.py"
      - ".github/workflows/w33_pass11190_ame10_sign_structure.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx ortools
      - run: python -m pytest -q tests/test_w33_pass11190_ame10_sign_structure.py
