name: W33 Pass 11092 nonsusy Z6-I twins are tachyonic

on:
  push:
    paths:
      - "analysis/w33_pass11092_nonsusy_z6i_twins_are_tachyonic.py"
      - "analysis/PASS11092_NONSUSY_Z6I_TWINS_ARE_TACHYONIC.md"
      - "data/w33_pass11092_nonsusy_z6i_twins_are_tachyonic.json"
      - "data/w33_pass11092_z6i_w33_models.json"
      - "data/w33_pass11092_orbifolder_twin_evidence.json"
      - "analysis/w33_pass11092_orbifolder_n0_patches.py"
      - "tests/test_w33_pass11092_nonsusy_z6i_twins_are_tachyonic.py"
      - ".github/workflows/w33_pass11092_nonsusy_z6i_twins_are_tachyonic.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib
      - run: python -m pytest -q tests/test_w33_pass11092_nonsusy_z6i_twins_are_tachyonic.py
