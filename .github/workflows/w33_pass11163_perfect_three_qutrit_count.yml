name: W33 Pass 11163 perfect three qutrit count

on:
  push:
    paths:
      - "analysis/w33_pass11163_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11163_PERFECT_THREE_QUTRIT_COUNT.md"
      - "data/w33_pass11163_*.json"
      - "tests/test_w33_pass11163_perfect_three_qutrit_count.py"
      - ".github/workflows/w33_pass11163_perfect_three_qutrit_count.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11163_perfect_three_qutrit_count.py
