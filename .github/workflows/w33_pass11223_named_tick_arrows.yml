name: W33 Pass 11223 named tick arrows

on:
  push:
    paths:
      - "analysis/w33_pass11223_*.py"
      - "analysis/PASS11223_NAMED_TICK_ARROWS.md"
      - "data/w33_pass11223_*.json"
      - "tests/test_w33_pass11223_named_tick_arrows.py"
      - ".github/workflows/w33_pass11223_named_tick_arrows.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx ortools python-sat
      - run: python -m pytest -q tests/test_w33_pass11223_named_tick_arrows.py
