name: W33 Pass 11151 u16 lattice

on:
  push:
    paths:
      - "analysis/w33_pass11151_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11151_U16_LATTICE.md"
      - "data/w33_pass11151_*.json"
      - "data/w33_pass11140_*.json"
      - "tests/test_w33_pass11151_u16_lattice.py"
      - ".github/workflows/w33_pass11151_u16_lattice.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11151_u16_lattice.py
