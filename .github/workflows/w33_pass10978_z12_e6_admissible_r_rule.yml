name: W33 Pass 10978 Z12-I E6 admissible R-rule

on:
  push:
    paths:
      - "analysis/w33_pass10978_z12_e6_admissible_r_rule.py"
      - "analysis/PASS10978_Z12_E6_ADMISSIBLE_R_RULE.md"
      - "analysis/PASS10978_Z12_E6_ADMISSIBLE_R_RULE_INSERT.tex"
      - "data/w33_pass10978_z12_e6_admissible_r_rule.json"
      - "tests/test_w33_pass10978_z12_e6_admissible_r_rule.py"
      - ".github/workflows/w33_pass10978_z12_e6_admissible_r_rule.yml"
  pull_request:
    paths:
      - "analysis/w33_pass10978_z12_e6_admissible_r_rule.py"
      - "tests/test_w33_pass10978_z12_e6_admissible_r_rule.py"

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib
      - run: python analysis/w33_pass10978_z12_e6_admissible_r_rule.py
      - run: python -m pytest -q tests/test_w33_pass10978_z12_e6_admissible_r_rule.py
