name: W33 Pass 11104 ckm and leptons

on:
  push:
    paths:
      - "analysis/w33_pass11104_*.py"
      - "analysis/w33_so16_selection_rules.py"
      - "analysis/PASS11104_CKM_AND_LEPTONS.md"
      - "data/w33_pass11104_*.json"
      - "tests/test_w33_pass11104_ckm_and_leptons.py"
      - ".github/workflows/w33_pass11104_ckm_and_leptons.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11104_ckm_and_leptons.py
