name: Pass 11580-11589 Spin10 SM breakthrough

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/w33_pass11580_spin10_pati_salam_hypercharge.py'
      - 'analysis/w33_pass11581_global_z6_anomalies.py'
      - 'analysis/w33_pass11582_overlap_charge_index.py'
      - 'analysis/w33_pass11583_clock_chirality_quaternion.py'
      - 'analysis/w33_pass11584_spin10_yukawa_channel.py'
      - 'analysis/w33_pass11585_variable_frame_spectral_firewall.py'
      - 'analysis/w33_pass11586_hypercharge_charge_lattice.py'
      - 'analysis/w33_pass11587_trinification_family_firewall.py'
      - 'analysis/w33_pass11588_external_internal_product_index.py'
      - 'analysis/w33_pass11589_synthesis.py'
      - 'data/PART_W33_PASS11580_11589_SPIN10_SM_BREAKTHROUGH.json'
      - 'tests/test_w33_pass11580_11589.py'
      - '.github/workflows/pass11580-11589-spin10-sm.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy pytest
      - name: Exceptional and charge theorems
        run: |
          python analysis/w33_pass11580_spin10_pati_salam_hypercharge.py
          python analysis/w33_pass11581_global_z6_anomalies.py
          python analysis/w33_pass11583_clock_chirality_quaternion.py
          python analysis/w33_pass11584_spin10_yukawa_channel.py
          python analysis/w33_pass11586_hypercharge_charge_lattice.py
          python analysis/w33_pass11587_trinification_family_firewall.py
          python analysis/w33_pass11588_external_internal_product_index.py
          python analysis/w33_pass11589_synthesis.py
      - name: Overlap and variable-frame probes
        run: |
          python analysis/w33_pass11582_overlap_charge_index.py
          python analysis/w33_pass11585_variable_frame_spectral_firewall.py
      - name: Focused regression
        run: pytest -q tests/test_w33_pass11580_11589.py
