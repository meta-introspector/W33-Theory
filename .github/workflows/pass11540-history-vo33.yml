name: Pass 11540 history VO33

on:
  push:
    paths:
      - 'analysis/w33_pass11540_history_vo33_orientation_square.py'
      - 'data/PART_W33_PASS11540_HISTORY_VO33_ORIENTATION_SQUARE.json'
      - 'tests/test_w33_pass11540_history_vo33_orientation_square.py'
      - '.github/workflows/pass11540-history-vo33.yml'
  pull_request:
    paths:
      - 'analysis/w33_pass11540_history_vo33_orientation_square.py'
      - 'data/PART_W33_PASS11540_HISTORY_VO33_ORIENTATION_SQUARE.json'
      - 'tests/test_w33_pass11540_history_vo33_orientation_square.py'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_w33_pass11540_history_vo33_orientation_square.py
