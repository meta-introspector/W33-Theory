name: W33 Pass 11153 temporal magic budget

on:
  push:
    paths:
      - "analysis/w33_pass11153_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11153_TEMPORAL_MAGIC_BUDGET.md"
      - "data/w33_pass11153_*.json"
      - "tests/test_w33_pass11153_temporal_magic_budget.py"
      - ".github/workflows/w33_pass11153_temporal_magic_budget.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11153_temporal_magic_budget.py
