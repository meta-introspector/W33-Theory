name: W33 Pass 11097 fractional fermion masses

on:
  push:
    paths:
      - "analysis/w33_pass11097_*.py"
      - "analysis/w33_so16_selection_rules.py"
      - "analysis/PASS11097_FRACTIONAL_FERMION_MASSES.md"
      - "data/w33_pass11097_*.json"
      - "tests/test_w33_pass11097_fractional_fermion_masses.py"
      - ".github/workflows/w33_pass11097_fractional_fermion_masses.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11097_fractional_fermion_masses.py
