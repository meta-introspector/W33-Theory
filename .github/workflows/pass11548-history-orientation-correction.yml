name: Pass 11548 history orientation correction

on:
  push:
    paths:
      - 'analysis/w33_pass11548_history_orientation_square_correction.py'
      - 'data/PART_W33_PASS11548_HISTORY_ORIENTATION_SQUARE_CORRECTION.json'
      - 'tests/test_w33_pass11548_history_orientation_square_correction.py'
      - '.github/workflows/pass11548-history-orientation-correction.yml'
  pull_request:
    paths:
      - 'analysis/w33_pass11548_history_orientation_square_correction.py'
      - 'data/PART_W33_PASS11548_HISTORY_ORIENTATION_SQUARE_CORRECTION.json'
      - 'tests/test_w33_pass11548_history_orientation_square_correction.py'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_w33_pass11548_history_orientation_square_correction.py
