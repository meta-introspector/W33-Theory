name: W33 Pass 11247 z6i_r_symmetry_data

on:
  push:
    paths:
      - "analysis/w33_pass11247_*.py"
      - "analysis/PASS11247_*.md"
      - "data/w33_pass11247_*.json"
      - "tests/test_w33_pass11247_z6i_r_symmetry_data.py"
      - ".github/workflows/w33_pass11247_z6i_r_symmetry_data.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx mpmath 
      - run: python -m pytest -q tests/test_w33_pass11247_z6i_r_symmetry_data.py
