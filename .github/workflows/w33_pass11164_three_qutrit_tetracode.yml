name: W33 Pass 11164 three qutrit tetracode

on:
  push:
    paths:
      - "analysis/w33_pass11164_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11164_THREE_QUTRIT_TETRACODE.md"
      - "data/w33_pass11164_*.json"
      - "tests/test_w33_pass11164_three_qutrit_tetracode.py"
      - ".github/workflows/w33_pass11164_three_qutrit_tetracode.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11164_three_qutrit_tetracode.py
