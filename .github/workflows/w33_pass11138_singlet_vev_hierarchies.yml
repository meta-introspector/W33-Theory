name: W33 Pass 11138 singlet vev hierarchies

on:
  push:
    paths:
      - "analysis/w33_pass11138_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11138_SINGLET_VEV_HIERARCHIES.md"
      - "data/w33_pass11138_*.json"
      - "tests/test_w33_pass11138_singlet_vev_hierarchies.py"
      - ".github/workflows/w33_pass11138_singlet_vev_hierarchies.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11138_singlet_vev_hierarchies.py
