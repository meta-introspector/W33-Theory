name: W33 Pass 11179 four qutrit near miss

on:
  push:
    paths:
      - "analysis/w33_pass11179_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11179_FOUR_QUTRIT_NEAR_MISS.md"
      - "data/w33_pass11179_*.json"
      - "tests/test_w33_pass11179_four_qutrit_near_miss.py"
      - ".github/workflows/w33_pass11179_four_qutrit_near_miss.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11179_four_qutrit_near_miss.py
