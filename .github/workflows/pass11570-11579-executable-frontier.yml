name: Pass 11570-11579 executable gauge gravity overlap

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/w33_pass11570_executable_sm_intersection.py'
      - 'analysis/w33_pass11570_centroid_classifier.py'
      - 'analysis/w33_pass11571_discrete_curvature.py'
      - 'analysis/w33_pass11573_11578_hamming_overlap.py'
      - 'analysis/w33_pass11574_event_plane_from_sm.py'
      - 'analysis/w33_pass11575_11576_sm_matter_commutant_anomaly.py'
      - 'data/PART_W33_PASS11570_11579_EXECUTABLE_GAUGE_GRAVITY_OVERLAP.json'
      - 'tests/test_w33_pass11570_11579.py'
      - '.github/workflows/pass11570-11579-executable-frontier.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy pytest
      - name: Exact exceptional intersection
        run: |
          python analysis/w33_pass11570_executable_sm_intersection.py
          python analysis/w33_pass11570_centroid_classifier.py
          python analysis/w33_pass11574_event_plane_from_sm.py
          python analysis/w33_pass11575_11576_sm_matter_commutant_anomaly.py
      - name: Curvature and overlap witnesses
        run: |
          python analysis/w33_pass11571_discrete_curvature.py
          python analysis/w33_pass11573_11578_hamming_overlap.py
      - name: Focused regression
        run: pytest -q tests/test_w33_pass11570_11579.py
