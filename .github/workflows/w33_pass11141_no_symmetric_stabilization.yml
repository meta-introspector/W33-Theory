name: W33 Pass 11141 no symmetric stabilization

on:
  push:
    paths:
      - "analysis/w33_pass11141_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11141_NO_SYMMETRIC_STABILIZATION.md"
      - "data/w33_pass1113[69]_*.json"
      - "data/w33_pass11141_*.json"
      - "data/w33_pass11146_*.json"
      - "tests/test_w33_pass11141_no_symmetric_stabilization.py"
      - ".github/workflows/w33_pass11141_no_symmetric_stabilization.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11141_no_symmetric_stabilization.py
