name: W33 Pass 11224 AME10 Glynn

on:
  push:
    paths:
      - "analysis/w33_pass11224_*.py"
      - "analysis/PASS11224_AME10_GLYNN.md"
      - "data/w33_pass11224_*.json"
      - "tests/test_w33_pass11224_ame10_f9_structure.py"
      - ".github/workflows/w33_pass11224_ame10_f9_structure.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx ortools python-sat
      - run: python -m pytest -q tests/test_w33_pass11224_ame10_f9_structure.py
