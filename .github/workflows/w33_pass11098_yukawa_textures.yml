name: W33 Pass 11098 yukawa textures

on:
  push:
    paths:
      - "analysis/w33_pass11098_*.py"
      - "analysis/w33_so16_selection_rules.py"
      - "analysis/PASS11098_YUKAWA_TEXTURES.md"
      - "data/w33_pass11098_*.json"
      - "tests/test_w33_pass11098_yukawa_textures.py"
      - ".github/workflows/w33_pass11098_yukawa_textures.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11098_yukawa_textures.py
