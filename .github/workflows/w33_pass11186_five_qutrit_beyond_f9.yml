name: W33 Pass 11186 five qutrit beyond f9

on:
  push:
    paths:
      - "analysis/w33_pass11186_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11186_FIVE_QUTRIT_BEYOND_F9.md"
      - "data/w33_pass11186_*.json"
      - "tests/test_w33_pass11186_five_qutrit_beyond_f9.py"
      - ".github/workflows/w33_pass11186_five_qutrit_beyond_f9.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11186_five_qutrit_beyond_f9.py
