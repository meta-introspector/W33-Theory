name: W33 Pass 11111 no 243 family group

on:
  push:
    paths:
      - "analysis/w33_pass11111_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11111_NO_243_FAMILY_GROUP.md"
      - "data/w33_pass11111_*.json"
      - "tests/test_w33_pass11111_no_243_family_group.py"
      - ".github/workflows/w33_pass11111_no_243_family_group.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11111_no_243_family_group.py
