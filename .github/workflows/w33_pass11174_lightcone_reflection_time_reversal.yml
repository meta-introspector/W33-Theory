name: W33 Pass 11174 lightcone reflection time reversal

on:
  push:
    paths:
      - "analysis/w33_pass11174_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11174_LIGHTCONE_REFLECTION_TIME_REVERSAL.md"
      - "data/w33_pass11174_*.json"
      - "tests/test_w33_pass11174_lightcone_reflection_time_reversal.py"
      - ".github/workflows/w33_pass11174_lightcone_reflection_time_reversal.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11174_lightcone_reflection_time_reversal.py
