name: W33 Pass 11178 three qutrit orbitals

on:
  push:
    paths:
      - "analysis/w33_pass11178_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11178_THREE_QUTRIT_ORBITALS.md"
      - "data/w33_pass11178_*.json"
      - "tests/test_w33_pass11178_three_qutrit_orbitals.py"
      - ".github/workflows/w33_pass11178_three_qutrit_orbitals.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11178_three_qutrit_orbitals.py
