name: W33 Pass 11143 space time two quadrangles

on:
  push:
    paths:
      - "analysis/w33_pass11143_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11143_SPACE_TIME_TWO_QUADRANGLES.md"
      - "data/w33_pass11143_*.json"
      - "tests/test_w33_pass11143_space_time_two_quadrangles.py"
      - ".github/workflows/w33_pass11143_space_time_two_quadrangles.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11143_space_time_two_quadrangles.py
