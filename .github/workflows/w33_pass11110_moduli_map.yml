name: W33 Pass 11110 moduli map

on:
  push:
    paths:
      - "analysis/w33_pass11110_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11110_MODULI_MAP.md"
      - "data/w33_pass11110_*.json"
      - "tests/test_w33_pass11110_moduli_map.py"
      - ".github/workflows/w33_pass11110_moduli_map.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11110_moduli_map.py
