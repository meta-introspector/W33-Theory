name: W33 Pass 11219 Gaussian arrow law

on:
  push:
    paths:
      - "analysis/w33_pass11219_*.py"
      - "analysis/PASS11219_GAUSSIAN_ARROW.md"
      - "data/w33_pass11219_*.json"
      - "tests/test_w33_pass11219_gaussian_arrow.py"
      - ".github/workflows/w33_pass11219_gaussian_arrow.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx ortools python-sat
      - run: python -m pytest -q tests/test_w33_pass11219_gaussian_arrow.py
