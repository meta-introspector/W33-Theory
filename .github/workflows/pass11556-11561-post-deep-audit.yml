name: Pass 11556-11561 post deep audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/w33_pass11556_psp_hamming_directed_fission_scheme.py'
      - 'analysis/w33_pass11557_pin_equivariant_event_dirac.py'
      - 'analysis/w33_pass11558_albert_pin_event_spinor_embedding.py'
      - 'analysis/w33_pass11559_fixed_dimension_gauge_frame_refinement.py'
      - 'analysis/w33_pass11560_translation_coinvariant_arrow_torsion.py'
      - 'analysis/w33_pass11561_native_e6_hesse_polynomial_law.py'
      - 'tests/test_w33_pass11556_11561.py'
      - '.github/workflows/pass11556-11561-post-deep-audit.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy pytest
      - name: Rebuild certificates
        run: |
          python analysis/w33_pass11556_psp_hamming_directed_fission_scheme.py
          python analysis/w33_pass11557_pin_equivariant_event_dirac.py
          python analysis/w33_pass11558_albert_pin_event_spinor_embedding.py
          python analysis/w33_pass11559_fixed_dimension_gauge_frame_refinement.py
          python analysis/w33_pass11560_translation_coinvariant_arrow_torsion.py
          python analysis/w33_pass11561_native_e6_hesse_polynomial_law.py
      - name: Focused regression
        run: pytest -q tests/test_w33_pass11556_11561.py
