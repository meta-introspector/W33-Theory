name: W33 Pass 11166 clock tick clifford

on:
  push:
    paths:
      - "analysis/w33_pass11166_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11166_CLOCK_TICK_CLIFFORD.md"
      - "data/w33_pass11166_*.json"
      - "tests/test_w33_pass11166_clock_tick_clifford.py"
      - ".github/workflows/w33_pass11166_clock_tick_clifford.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11166_clock_tick_clifford.py
