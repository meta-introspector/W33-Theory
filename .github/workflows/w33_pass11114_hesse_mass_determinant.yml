name: W33 Pass 11114 hesse mass determinant

on:
  push:
    paths:
      - "analysis/w33_pass11114_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11114_HESSE_MASS_DETERMINANT.md"
      - "data/w33_pass11114_*.json"
      - "tests/test_w33_pass11114_hesse_mass_determinant.py"
      - ".github/workflows/w33_pass11114_hesse_mass_determinant.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11114_hesse_mass_determinant.py
