name: Pass 11541 history shell scheme

on:
  push:
    paths:
      - 'analysis/w33_pass11541_history_quadratic_shell_scheme.py'
      - 'data/PART_W33_PASS11541_HISTORY_QUADRATIC_SHELL_SCHEME.json'
      - 'tests/test_w33_pass11541_history_quadratic_shell_scheme.py'
      - '.github/workflows/pass11541-history-shell-scheme.yml'
  pull_request:
    paths:
      - 'analysis/w33_pass11541_history_quadratic_shell_scheme.py'
      - 'data/PART_W33_PASS11541_HISTORY_QUADRATIC_SHELL_SCHEME.json'
      - 'tests/test_w33_pass11541_history_quadratic_shell_scheme.py'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_w33_pass11541_history_quadratic_shell_scheme.py
