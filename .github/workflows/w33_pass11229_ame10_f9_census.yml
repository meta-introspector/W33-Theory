name: W33 Pass 11229 AME(10,3) F9 census

on:
  push:
    paths:
      - "analysis/w33_pass11229_*.py"
      - "analysis/PASS11229_*.md"
      - "data/w33_pass11229_*.json"
      - "tests/test_w33_pass11229_ame10_f9_census.py"
      - ".github/workflows/w33_pass11229_ame10_f9_census.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx mpmath 
      - run: python -m pytest -q tests/test_w33_pass11229_ame10_f9_census.py
