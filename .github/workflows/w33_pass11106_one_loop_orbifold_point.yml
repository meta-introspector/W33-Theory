name: W33 Pass 11106 one loop orbifold point

on:
  push:
    paths:
      - "analysis/w33_pass11106_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11106_ONE_LOOP_ORBIFOLD_POINT.md"
      - "data/w33_pass11106_*.json"
      - "tests/test_w33_pass11106_one_loop_orbifold_point.py"
      - ".github/workflows/w33_pass11106_one_loop_orbifold_point.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11106_one_loop_orbifold_point.py
