name: W33 Pass 11135 fi scale no mechanism

on:
  push:
    paths:
      - "analysis/w33_pass11135_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11135_FI_SCALE_NO_MECHANISM.md"
      - "data/w33_pass11135_*.json"
      - "tests/test_w33_pass11135_fi_scale_no_mechanism.py"
      - ".github/workflows/w33_pass11135_fi_scale_no_mechanism.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11135_fi_scale_no_mechanism.py
