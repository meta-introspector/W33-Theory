name: W33 Pass 11148 polygamy in time

on:
  push:
    paths:
      - "analysis/w33_pass11148_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11148_POLYGAMY_IN_TIME.md"
      - "data/w33_pass11148_*.json"
      - "tests/test_w33_pass11148_polygamy_in_time.py"
      - ".github/workflows/w33_pass11148_polygamy_in_time.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11148_polygamy_in_time.py
