name: W33 Pass 11169 perfect gate local orbits

on:
  push:
    paths:
      - "analysis/w33_pass11169_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11169_PERFECT_GATE_LOCAL_ORBITS.md"
      - "data/w33_pass11169_*.json"
      - "tests/test_w33_pass11169_perfect_gate_local_orbits.py"
      - ".github/workflows/w33_pass11169_perfect_gate_local_orbits.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11169_perfect_gate_local_orbits.py
