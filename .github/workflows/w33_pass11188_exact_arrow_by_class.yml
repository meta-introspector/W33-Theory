name: W33 Pass 11188 exact arrow by class

on:
  push:
    paths:
      - "analysis/w33_pass11188_*.py"
      - "analysis/PASS11188_EXACT_ARROW_BY_CLASS.md"
      - "data/w33_pass11188_*.json"
      - "tests/test_w33_pass11188_exact_arrow_by_class.py"
      - ".github/workflows/w33_pass11188_exact_arrow_by_class.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx ortools
      - run: python -m pytest -q tests/test_w33_pass11188_exact_arrow_by_class.py
