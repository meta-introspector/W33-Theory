name: W33 Pass 11231 dynamical area law

on:
  push:
    paths:
      - "analysis/w33_pass11231_*.py"
      - "analysis/PASS11231_DYNAMICAL_AREA_LAW.md"
      - "data/w33_pass11231_*.json"
      - "tests/test_w33_pass11231_dynamical_area_law.py"
      - ".github/workflows/w33_pass11231_dynamical_area_law.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx ortools python-sat
      - run: python -m pytest -q tests/test_w33_pass11231_dynamical_area_law.py
