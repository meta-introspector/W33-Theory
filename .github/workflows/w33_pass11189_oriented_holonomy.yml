name: W33 Pass 11189 oriented holonomy

on:
  push:
    paths:
      - "analysis/w33_pass11189_*.py"
      - "analysis/PASS11189_ORIENTED_HOLONOMY.md"
      - "data/w33_pass11189_*.json"
      - "tests/test_w33_pass11189_oriented_holonomy.py"
      - ".github/workflows/w33_pass11189_oriented_holonomy.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx ortools
      - run: python -m pytest -q tests/test_w33_pass11189_oriented_holonomy.py
