name: W33 Pass 11115 axis duality and window

on:
  push:
    paths:
      - "analysis/w33_pass11115_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11115_AXIS_DUALITY_AND_WINDOW.md"
      - "data/w33_pass11115_*.json"
      - "tests/test_w33_pass11115_axis_duality_and_window.py"
      - ".github/workflows/w33_pass11115_axis_duality_and_window.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11115_axis_duality_and_window.py
