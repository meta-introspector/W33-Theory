name: W33 Pass 11134 dual tachyon species

on:
  push:
    paths:
      - "analysis/w33_pass11134_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11134_DUAL_TACHYON_SPECIES.md"
      - "data/w33_pass11134_*.json"
      - "tests/test_w33_pass11134_dual_tachyon_species.py"
      - ".github/workflows/w33_pass11134_dual_tachyon_species.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11134_dual_tachyon_species.py
