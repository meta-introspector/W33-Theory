name: W33 Pass 11131 unlocked across 21

on:
  push:
    paths:
      - "analysis/w33_pass11131_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11131_UNLOCKED_ACROSS_21.md"
      - "data/w33_pass11131_*.json"
      - "tests/test_w33_pass11131_unlocked_across_21.py"
      - ".github/workflows/w33_pass11131_unlocked_across_21.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11131_unlocked_across_21.py
