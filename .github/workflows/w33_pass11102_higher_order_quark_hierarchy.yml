name: W33 Pass 11102 higher order quark hierarchy

on:
  push:
    paths:
      - "analysis/w33_pass11102_*.py"
      - "analysis/w33_so16_selection_rules.py"
      - "analysis/PASS11102_HIGHER_ORDER_QUARK_HIERARCHY.md"
      - "data/w33_pass11102_*.json"
      - "tests/test_w33_pass11102_higher_order_quark_hierarchy.py"
      - ".github/workflows/w33_pass11102_higher_order_quark_hierarchy.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11102_higher_order_quark_hierarchy.py
