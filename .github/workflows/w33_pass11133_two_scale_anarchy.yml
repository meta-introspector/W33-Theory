name: W33 Pass 11133 two scale anarchy

on:
  push:
    paths:
      - "analysis/w33_pass11132_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11133_TWO_SCALE_ANARCHY.md"
      - "data/w33_pass11132_*.json"
      - "tests/test_w33_pass11133_two_scale_anarchy.py"
      - ".github/workflows/w33_pass11133_two_scale_anarchy.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11133_two_scale_anarchy.py
