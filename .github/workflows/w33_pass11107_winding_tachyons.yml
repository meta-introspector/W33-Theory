name: W33 Pass 11107 winding tachyons

on:
  push:
    paths:
      - "analysis/w33_pass11107_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11107_WINDING_TACHYONS.md"
      - "data/w33_pass11107_*.json"
      - "tests/test_w33_pass11107_winding_tachyons.py"
      - ".github/workflows/w33_pass11107_winding_tachyons.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11107_winding_tachyons.py
