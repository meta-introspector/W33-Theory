name: W33 Pass 11101 localized higgs heavy top

on:
  push:
    paths:
      - "analysis/w33_pass11101_*.py"
      - "analysis/w33_so16_selection_rules.py"
      - "analysis/PASS11101_LOCALIZED_HIGGS_HEAVY_TOP.md"
      - "data/w33_pass11101_*.json"
      - "tests/test_w33_pass11101_localized_higgs_heavy_top.py"
      - ".github/workflows/w33_pass11101_localized_higgs_heavy_top.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11101_localized_higgs_heavy_top.py
