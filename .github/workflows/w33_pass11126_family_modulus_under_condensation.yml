name: W33 Pass 11126 family modulus under condensation

on:
  push:
    paths:
      - "analysis/w33_pass11126_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11126_FAMILY_MODULUS_UNDER_CONDENSATION.md"
      - "data/w33_pass11126_*.json"
      - "tests/test_w33_pass11126_family_modulus_under_condensation.py"
      - ".github/workflows/w33_pass11126_family_modulus_under_condensation.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11126_family_modulus_under_condensation.py
