name: W33 Pass 11246 discrete anomaly escapes

on:
  push:
    paths:
      - "analysis/w33_pass11246_*.py"
      - "analysis/PASS11246_*.md"
      - "data/w33_pass11246_*.json"
      - "tests/test_w33_pass11246_discrete_anomaly_escapes.py"
      - ".github/workflows/w33_pass11246_discrete_anomaly_escapes.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libgmp-dev libcdd-dev
      - run: pip install numpy scipy sympy pytest networkx mpmath pycddlib
      - run: python -m pytest -q tests/test_w33_pass11246_discrete_anomaly_escapes.py
