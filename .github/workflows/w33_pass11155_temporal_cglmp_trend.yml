name: W33 Pass 11155 temporal cglmp trend

on:
  push:
    paths:
      - "analysis/w33_pass11155_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11155_TEMPORAL_CGLMP_TREND.md"
      - "data/w33_pass11155_*.json"
      - "data/w33_pass11147_*.json"
      - "tests/test_w33_pass11155_temporal_cglmp_trend.py"
      - ".github/workflows/w33_pass11155_temporal_cglmp_trend.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11155_temporal_cglmp_trend.py
