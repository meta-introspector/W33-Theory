name: W33 Pass 11108 tachyon free moduli rescan

on:
  push:
    paths:
      - "analysis/w33_pass11108_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11108_TACHYON_FREE_MODULI_RESCAN.md"
      - "data/w33_pass11108_*.json"
      - "tests/test_w33_pass11108_tachyon_free_moduli_rescan.py"
      - ".github/workflows/w33_pass11108_tachyon_free_moduli_rescan.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11108_tachyon_free_moduli_rescan.py
