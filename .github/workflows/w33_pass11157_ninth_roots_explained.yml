name: W33 Pass 11157 ninth roots explained

on:
  push:
    paths:
      - "analysis/w33_pass11157_*.py"
      - "analysis/w33_pass11152_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11157_NINTH_ROOTS_EXPLAINED.md"
      - "data/w33_pass11157_*.json"
      - "tests/test_w33_pass11157_ninth_roots_explained.py"
      - ".github/workflows/w33_pass11157_ninth_roots_explained.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11157_ninth_roots_explained.py
