name: W33 Pass 11125 bfield charged onset

on:
  push:
    paths:
      - "analysis/w33_pass11125_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11125_BFIELD_CHARGED_ONSET.md"
      - "data/w33_pass11125_*.json"
      - "tests/test_w33_pass11125_bfield_charged_onset.py"
      - ".github/workflows/w33_pass11125_bfield_charged_onset.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11125_bfield_charged_onset.py
