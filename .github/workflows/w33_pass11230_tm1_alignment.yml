name: W33 Pass 11230 TM1 alignment

on:
  push:
    paths:
      - "analysis/w33_pass11230_*.py"
      - "analysis/PASS11230_*.md"
      - "data/w33_pass11230_*.json"
      - "tests/test_w33_pass11230_tm1_alignment.py"
      - ".github/workflows/w33_pass11230_tm1_alignment.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx mpmath 
      - run: python -m pytest -q tests/test_w33_pass11230_tm1_alignment.py
