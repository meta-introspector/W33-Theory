name: W33 Pass 11142 higgs mixing up sector

on:
  push:
    paths:
      - "analysis/w33_pass11142_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11142_HIGGS_MIXING_UP_SECTOR.md"
      - "data/w33_pass11142_*.json"
      - "tests/test_w33_pass11142_higgs_mixing_up_sector.py"
      - ".github/workflows/w33_pass11142_higgs_mixing_up_sector.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11142_higgs_mixing_up_sector.py
