name: W33 Pass 11154 polygamy optimum structure

on:
  push:
    paths:
      - "analysis/w33_pass11154_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11154_POLYGAMY_OPTIMUM_STRUCTURE.md"
      - "data/w33_pass11154_*.json"
      - "tests/test_w33_pass11154_polygamy_optimum_structure.py"
      - ".github/workflows/w33_pass11154_polygamy_optimum_structure.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11154_polygamy_optimum_structure.py
