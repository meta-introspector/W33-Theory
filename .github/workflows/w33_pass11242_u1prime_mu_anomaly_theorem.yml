name: W33 Pass 11242 u1prime_mu_anomaly_theorem

on:
  push:
    paths:
      - "analysis/w33_pass11242_*.py"
      - "analysis/PASS11242_*.md"
      - "data/w33_pass11242_*.json"
      - "tests/test_w33_pass11242_u1prime_mu_anomaly_theorem.py"
      - ".github/workflows/w33_pass11242_u1prime_mu_anomaly_theorem.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libgmp-dev libcdd-dev
      - run: pip install pycddlib && pip install numpy scipy sympy pytest networkx mpmath 
      - run: python -m pytest -q tests/test_w33_pass11242_u1prime_mu_anomaly_theorem.py
