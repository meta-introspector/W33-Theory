name: W33 Pass 11212 one chirality

on:
  push:
    paths:
      - "analysis/w33_pass11212_*.py"
      - "analysis/PASS11212_ONE_CHIRALITY.md"
      - "data/w33_pass11212_*.json"
      - "tests/test_w33_pass11212_one_chirality.py"
      - ".github/workflows/w33_pass11212_one_chirality.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx ortools python-sat
      - run: python -m pytest -q tests/test_w33_pass11212_one_chirality.py
