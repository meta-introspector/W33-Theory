name: W33 Pass 11103 reflection breaking vacua

on:
  push:
    paths:
      - "analysis/w33_pass11103_*.py"
      - "analysis/w33_so16_selection_rules.py"
      - "analysis/PASS11103_REFLECTION_BREAKING_VACUA.md"
      - "data/w33_pass11103_*.json"
      - "tests/test_w33_pass11103_reflection_breaking_vacua.py"
      - ".github/workflows/w33_pass11103_reflection_breaking_vacua.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11103_reflection_breaking_vacua.py
