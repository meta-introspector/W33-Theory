name: W33 Pass 11121 hesse gauge bridge

on:
  push:
    paths:
      - "analysis/w33_pass11121_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11121_HESSE_GAUGE_BRIDGE.md"
      - "data/w33_pass11121_*.json"
      - "tests/test_w33_pass11121_hesse_gauge_bridge.py"
      - ".github/workflows/w33_pass11121_hesse_gauge_bridge.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11121_hesse_gauge_bridge.py
