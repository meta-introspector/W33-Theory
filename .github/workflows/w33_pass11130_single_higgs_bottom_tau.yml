name: W33 Pass 11130 single higgs bottom tau

on:
  push:
    paths:
      - "analysis/w33_pass11130_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11130_SINGLE_HIGGS_BOTTOM_TAU.md"
      - "data/w33_pass11130_*.json"
      - "tests/test_w33_pass11130_single_higgs_bottom_tau.py"
      - ".github/workflows/w33_pass11130_single_higgs_bottom_tau.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11130_single_higgs_bottom_tau.py
