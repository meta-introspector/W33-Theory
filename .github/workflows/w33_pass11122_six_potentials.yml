name: W33 Pass 11122 six potentials

on:
  push:
    paths:
      - "analysis/w33_pass11122_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11122_SIX_POTENTIALS.md"
      - "data/w33_pass11122_*.json"
      - "tests/test_w33_pass11122_six_potentials.py"
      - ".github/workflows/w33_pass11122_six_potentials.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11122_six_potentials.py
