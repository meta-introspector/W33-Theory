name: W33 Pass 11120 rho cell criterion

on:
  push:
    paths:
      - "analysis/w33_pass11120_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11120_RHO_CELL_CRITERION.md"
      - "data/w33_pass11120_*.json"
      - "tests/test_w33_pass11120_rho_cell_criterion.py"
      - ".github/workflows/w33_pass11120_rho_cell_criterion.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11120_rho_cell_criterion.py
