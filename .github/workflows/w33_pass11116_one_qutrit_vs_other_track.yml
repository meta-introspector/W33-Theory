name: W33 Pass 11116 one qutrit vs other track

on:
  push:
    paths:
      - "analysis/w33_pass11116_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11116_ONE_QUTRIT_VS_OTHER_TRACK.md"
      - "data/w33_pass11116_*.json"
      - "tests/test_w33_pass11116_one_qutrit_vs_other_track.py"
      - ".github/workflows/w33_pass11116_one_qutrit_vs_other_track.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11116_one_qutrit_vs_other_track.py
