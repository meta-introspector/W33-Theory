name: W33 Pass 11210 Kramers time reversal

on:
  push:
    paths:
      - "analysis/w33_pass11210_*.py"
      - "analysis/PASS11210_KRAMERS_TIME_REVERSAL.md"
      - "data/w33_pass11210_*.json"
      - "tests/test_w33_pass11210_kramers_time_reversal.py"
      - ".github/workflows/w33_pass11210_kramers_time_reversal.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx ortools python-sat
      - run: python -m pytest -q tests/test_w33_pass11210_kramers_time_reversal.py
