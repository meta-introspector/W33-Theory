name: W33 Pass 11093 tachyon free filter z6i scan

on:
  push:
    paths:
      - "analysis/w33_pass11093_tachyon_free_filter_z6i_scan.py"
      - "analysis/PASS11093_TACHYON_FREE_FILTER_Z6I_SCAN.md"
      - "data/w33_pass11093_*.json"
      - "tests/test_w33_pass11093_tachyon_free_filter_z6i_scan.py"
      - ".github/workflows/w33_pass11093_tachyon_free_filter_z6i_scan.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib
      - run: python -m pytest -q tests/test_w33_pass11093_tachyon_free_filter_z6i_scan.py
