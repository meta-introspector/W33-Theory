name: W33 Pass 11176 temporal echo

on:
  push:
    paths:
      - "analysis/w33_pass11176_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11176_TEMPORAL_ECHO.md"
      - "data/w33_pass11176_*.json"
      - "tests/test_w33_pass11176_temporal_echo.py"
      - ".github/workflows/w33_pass11176_temporal_echo.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11176_temporal_echo.py
