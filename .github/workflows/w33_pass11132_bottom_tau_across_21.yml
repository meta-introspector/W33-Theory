name: W33 Pass 11132 bottom tau across 21

on:
  push:
    paths:
      - "analysis/w33_pass11132_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11132_BOTTOM_TAU_ACROSS_21.md"
      - "data/w33_pass11132_*.json"
      - "tests/test_w33_pass11132_bottom_tau_across_21.py"
      - ".github/workflows/w33_pass11132_bottom_tau_across_21.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11132_bottom_tau_across_21.py
