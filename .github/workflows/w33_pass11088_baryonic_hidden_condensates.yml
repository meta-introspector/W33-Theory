name: W33 Pass 11088 baryonic hidden condensates

on:
  push:
    paths:
      - "analysis/w33_pass11088_baryonic_hidden_condensates.py"
      - "analysis/w33_fast_parity_realizability.py"
      - "analysis/PASS11088_BARYONIC_HIDDEN_CONDENSATES.md"
      - "data/w33_pass11088_baryonic_hidden_condensates.json"
      - "tests/test_w33_pass11088_baryonic_hidden_condensates.py"
      - ".github/workflows/w33_pass11088_baryonic_hidden_condensates.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib
      - run: python -m pytest -q tests/test_w33_pass11088_baryonic_hidden_condensates.py
