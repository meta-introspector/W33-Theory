name: W33 Pass 11117 neutral condensate

on:
  push:
    paths:
      - "analysis/w33_pass11117_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11117_NEUTRAL_CONDENSATE.md"
      - "data/w33_pass11117_*.json"
      - "tests/test_w33_pass11117_neutral_condensate.py"
      - ".github/workflows/w33_pass11117_neutral_condensate.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11117_neutral_condensate.py
