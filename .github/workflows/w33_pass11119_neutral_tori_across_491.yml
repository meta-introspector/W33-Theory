name: W33 Pass 11119 neutral tori across 491

on:
  push:
    paths:
      - "analysis/w33_pass11119_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11119_NEUTRAL_TORI_ACROSS_491.md"
      - "data/w33_pass11119_*.json"
      - "tests/test_w33_pass11119_neutral_tori_across_491.py"
      - ".github/workflows/w33_pass11119_neutral_tori_across_491.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11119_neutral_tori_across_491.py
