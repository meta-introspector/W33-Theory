name: W33 Pass 11161 scrambling and arrow

on:
  push:
    paths:
      - "analysis/w33_pass11161_*.py"
      - "analysis/w33_pass11156_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11161_SCRAMBLING_AND_ARROW.md"
      - "data/w33_pass11161_*.json"
      - "tests/test_w33_pass11161_scrambling_and_arrow.py"
      - ".github/workflows/w33_pass11161_scrambling_and_arrow.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11161_scrambling_and_arrow.py
