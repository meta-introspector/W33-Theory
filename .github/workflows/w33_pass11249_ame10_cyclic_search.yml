name: W33 Pass 11249 AME10 cyclic search

on:
  push:
    paths:
      - "analysis/w33_pass11249_*.py"
      - "analysis/PASS11249_*.md"
      - "data/w33_pass11249_*.json"
      - "tests/test_w33_pass11249_ame10_cyclic_search.py"
      - ".github/workflows/w33_pass11249_ame10_cyclic_search.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx mpmath 
      - run: python -m pytest -q tests/test_w33_pass11249_ame10_cyclic_search.py
