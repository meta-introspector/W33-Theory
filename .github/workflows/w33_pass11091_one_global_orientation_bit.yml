name: W33 Pass 11091 one global orientation bit

on:
  push:
    paths:
      - "analysis/w33_pass11091_one_global_orientation_bit.py"
      - "data/w33_pass11091_one_global_orientation_bit.json"
      - "tests/test_w33_pass11091_one_global_orientation_bit.py"
      - ".github/workflows/w33_pass11091_one_global_orientation_bit.yml"

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest
      - run: python analysis/w33_pass11091_one_global_orientation_bit.py
      - run: python -m pytest -q tests/test_w33_pass11091_one_global_orientation_bit.py
