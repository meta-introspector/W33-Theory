name: W33 Pass 11240 clean vacuum discrete rules

on:
  push:
    paths:
      - "analysis/w33_pass11240_*.py"
      - "analysis/PASS11240_*.md"
      - "data/w33_pass11240_*.json"
      - "tests/test_w33_pass11240_clean_vacuum_discrete_rules.py"
      - ".github/workflows/w33_pass11240_clean_vacuum_discrete_rules.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libgmp-dev libcdd-dev
      - run: pip install numpy scipy sympy pytest networkx mpmath pycddlib
      - run: python -m pytest -q tests/test_w33_pass11240_clean_vacuum_discrete_rules.py
