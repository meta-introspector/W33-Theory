name: W33 Pass 11185 e6 yukawa sectors

on:
  push:
    paths:
      - "analysis/w33_pass11185_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11185_E6_YUKAWA_SECTORS.md"
      - "data/w33_pass11185_*.json"
      - "tests/test_w33_pass11185_e6_yukawa_sectors.py"
      - ".github/workflows/w33_pass11185_e6_yukawa_sectors.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11185_e6_yukawa_sectors.py
