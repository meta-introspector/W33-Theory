name: W33 Pass 11124 condensate unlocked couplings

on:
  push:
    paths:
      - "analysis/w33_pass11124_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11124_CONDENSATE_UNLOCKED_COUPLINGS.md"
      - "data/w33_pass11124_*.json"
      - "tests/test_w33_pass11124_condensate_unlocked_couplings.py"
      - ".github/workflows/w33_pass11124_condensate_unlocked_couplings.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11124_condensate_unlocked_couplings.py
