name: W33 Pass 11165 three qutrit arrow

on:
  push:
    paths:
      - "analysis/w33_pass11165_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11165_THREE_QUTRIT_ARROW.md"
      - "data/w33_pass11165_*.json"
      - "tests/test_w33_pass11165_three_qutrit_arrow.py"
      - ".github/workflows/w33_pass11165_three_qutrit_arrow.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11165_three_qutrit_arrow.py
