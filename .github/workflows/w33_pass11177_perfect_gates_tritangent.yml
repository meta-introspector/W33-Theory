name: W33 Pass 11177 perfect gates tritangent

on:
  push:
    paths:
      - "analysis/w33_pass11177_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11177_PERFECT_GATES_TRITANGENT.md"
      - "data/w33_pass11177_*.json"
      - "tests/test_w33_pass11177_perfect_gates_tritangent.py"
      - ".github/workflows/w33_pass11177_perfect_gates_tritangent.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11177_perfect_gates_tritangent.py
