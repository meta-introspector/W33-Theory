name: W33 Pass 11222 why 54

on:
  push:
    paths:
      - "analysis/w33_pass11222_*.py"
      - "analysis/PASS11222_WHY_54.md"
      - "data/w33_pass11222_*.json"
      - "tests/test_w33_pass11222_why_54.py"
      - ".github/workflows/w33_pass11222_why_54.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx ortools python-sat
      - run: python -m pytest -q tests/test_w33_pass11222_why_54.py
