name: W33 Pass 11248 sequestered_tm1

on:
  push:
    paths:
      - "analysis/w33_pass11248_*.py"
      - "analysis/PASS11248_*.md"
      - "data/w33_pass11248_*.json"
      - "tests/test_w33_pass11248_sequestered_tm1.py"
      - ".github/workflows/w33_pass11248_sequestered_tm1.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx mpmath 
      - run: python -m pytest -q tests/test_w33_pass11248_sequestered_tm1.py
