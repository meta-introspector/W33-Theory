name: W33 Pass 11168 clock dual pair

on:
  push:
    paths:
      - "analysis/w33_pass11168_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11168_CLOCK_DUAL_PAIR.md"
      - "data/w33_pass11168_*.json"
      - "tests/test_w33_pass11168_clock_dual_pair.py"
      - ".github/workflows/w33_pass11168_clock_dual_pair.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11168_clock_dual_pair.py
