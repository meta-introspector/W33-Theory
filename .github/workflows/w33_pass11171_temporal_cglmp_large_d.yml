name: W33 Pass 11171 temporal cglmp large d

on:
  push:
    paths:
      - "analysis/w33_pass11171_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11171_TEMPORAL_CGLMP_LARGE_D.md"
      - "data/w33_pass11171_*.json"
      - "tests/test_w33_pass11171_temporal_cglmp_large_d.py"
      - ".github/workflows/w33_pass11171_temporal_cglmp_large_d.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11171_temporal_cglmp_large_d.py
