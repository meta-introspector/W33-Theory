name: W33 Pass 11158 perfect three qutrit gates

on:
  push:
    paths:
      - "analysis/w33_pass11158_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11158_PERFECT_THREE_QUTRIT_GATES.md"
      - "data/w33_pass11158_*.json"
      - "tests/test_w33_pass11158_perfect_three_qutrit_gates.py"
      - ".github/workflows/w33_pass11158_perfect_three_qutrit_gates.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11158_perfect_three_qutrit_gates.py
