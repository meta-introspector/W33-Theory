name: W33 Pass 11095 so16xso16 a8 standard models

on:
  push:
    paths:
      - "analysis/w33_pass11095_so16xso16_a8_standard_models.py"
      - "analysis/PASS11095_SO16XSO16_A8_STANDARD_MODELS.md"
      - "data/w33_pass11095_*.json"
      - "tests/test_w33_pass11095_so16xso16_a8_standard_models.py"
      - ".github/workflows/w33_pass11095_so16xso16_a8_standard_models.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib
      - run: python -m pytest -q tests/test_w33_pass11095_so16xso16_a8_standard_models.py
