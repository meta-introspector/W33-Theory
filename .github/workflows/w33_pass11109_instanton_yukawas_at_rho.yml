name: W33 Pass 11109 instanton yukawas at rho

on:
  push:
    paths:
      - "analysis/w33_pass11109_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11109_INSTANTON_YUKAWAS_AT_RHO.md"
      - "data/w33_pass11109_*.json"
      - "tests/test_w33_pass11109_instanton_yukawas_at_rho.py"
      - ".github/workflows/w33_pass11109_instanton_yukawas_at_rho.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11109_instanton_yukawas_at_rho.py
