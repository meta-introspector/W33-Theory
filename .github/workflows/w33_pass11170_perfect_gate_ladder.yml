name: W33 Pass 11170 perfect gate ladder

on:
  push:
    paths:
      - "analysis/w33_pass11170_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11170_PERFECT_GATE_LADDER.md"
      - "data/w33_pass11170_*.json"
      - "tests/test_w33_pass11170_perfect_gate_ladder.py"
      - ".github/workflows/w33_pass11170_perfect_gate_ladder.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11170_perfect_gate_ladder.py
