name: W33 Pass 11184 merged orbitals

on:
  push:
    paths:
      - "analysis/w33_pass11184_*.py"
      - "analysis/w33_so16_one_loop.py"
      - "analysis/PASS11184_MERGED_ORBITALS.md"
      - "data/w33_pass11184_*.json"
      - "tests/test_w33_pass11184_merged_orbitals.py"
      - ".github/workflows/w33_pass11184_merged_orbitals.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11184_merged_orbitals.py
