name: W33 Pass 11105 delta54 flavour join

on:
  push:
    paths:
      - "analysis/w33_pass11105_*.py"
      - "analysis/w33_so16_selection_rules.py"
      - "analysis/PASS11105_DELTA54_FLAVOUR_JOIN.md"
      - "data/w33_pass11105_*.json"
      - "tests/test_w33_pass11105_delta54_flavour_join.py"
      - ".github/workflows/w33_pass11105_delta54_flavour_join.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib networkx
      - run: python -m pytest -q tests/test_w33_pass11105_delta54_flavour_join.py
