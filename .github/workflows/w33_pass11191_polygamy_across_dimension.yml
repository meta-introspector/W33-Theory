name: W33 Pass 11191 polygamy across dimension

on:
  push:
    paths:
      - "analysis/w33_pass11191_*.py"
      - "analysis/PASS11191_POLYGAMY_ACROSS_DIMENSION.md"
      - "data/w33_pass11191_*.json"
      - "tests/test_w33_pass11191_polygamy_across_dimension.py"
      - ".github/workflows/w33_pass11191_polygamy_across_dimension.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest networkx ortools
      - run: python -m pytest -q tests/test_w33_pass11191_polygamy_across_dimension.py
